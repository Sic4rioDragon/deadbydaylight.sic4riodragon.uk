name: DBD achievements - sync and manage
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Sync everyone, add a player, remove a player, or set a name override'
        required: true
        type: choice
        default: sync
        options:
          - sync
          - add
          - remove
          - rename
      steam_id:
        description: 'SteamID64 for add, remove or rename (leave empty for sync)'
        required: false
        type: string
      display_name:
        description: 'Optional name when adding; for rename, blank clears override'
        required: false
        type: string
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dbd-achievements
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update player data
        if: github.event_name != 'push'
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          MODE: ${{ github.event.inputs.action || 'sync' }}
          STEAM_ID: ${{ github.event.inputs.steam_id || '' }}
          DISPLAY_NAME: ${{ github.event.inputs.display_name || '' }}
        run: node scripts/sync-achievements.cjs "$MODE" "$STEAM_ID" "$DISPLAY_NAME"
      - name: Refresh farming guide links
        if: github.event_name != 'push'
        run: node scripts/sync-farming-links.cjs
      - name: Commit updated public data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements/players.json achievements/players/ achievements/achievements.base.json achievements/achievements.icons.json achievements/catalog-review.json achievements/farming-links.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DBD achievement snapshots"
            git push
          fi
      - name: Validate site data
        run: node scripts/validate-data.cjs
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub's artifact listing can briefly lag behind a successful upload.
      # deploy-pages looks up this artifact by name and otherwise fails with
      # "No artifacts named github-pages", even when the upload succeeded.
      - name: Wait for Pages artifact to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' 2>/dev/null || true)"
            if [[ -n "$artifact_id" ]]; then
              echo "Pages artifact visible: $artifact_id (attempt $attempt)"
              exit 0
            fi
            echo "Waiting for GitHub Pages artifact metadata (attempt $attempt/30)..."
            sleep 5
          done
          echo "::error::Pages artifact was uploaded but is not visible through the Actions API."
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
